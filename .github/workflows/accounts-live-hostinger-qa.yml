name: Accounts Hostinger Live Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Production]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: accounts-hostinger-live-smoke
  cancel-in-progress: true

jobs:
  accounts-live-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QA secrets
        env:
          QA_USERNAME: ${{ secrets.TRANSTRADE_QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.TRANSTRADE_QA_PASSWORD }}
        run: |
          test -n "$QA_USERNAME" || { echo "Missing TRANSTRADE_QA_USERNAME"; exit 1; }
          test -n "$QA_PASSWORD" || { echo "Missing TRANSTRADE_QA_PASSWORD"; exit 1; }
      - name: Install browser runtime
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Wait for Hostinger deployment to settle
        run: |
          sleep 75
          ready=0
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 --output /dev/null https://app.transtradeinternational.com/login.php; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "::warning::Preflight could not reach Hostinger; continuing to the authoritative browser test."
          fi
      - name: Run authenticated read-only Accounts smoke test
        env:
          TRANSTRADE_BASE_URL: https://app.transtradeinternational.com
          TRANSTRADE_QA_USERNAME: ${{ secrets.TRANSTRADE_QA_USERNAME }}
          TRANSTRADE_QA_PASSWORD: ${{ secrets.TRANSTRADE_QA_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/live/accounts-hostinger-qa.spec.js --reporter=line,html
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: accounts-live-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

