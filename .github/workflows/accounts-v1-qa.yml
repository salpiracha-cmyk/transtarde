name: Accounts V1 QA

on:
  push:
    branches: [main, accounts-v1-foundation]
    paths: ['index.html','accounts/**','api/**','scripts/**','auth_store.php','product_stage.php','module.php','exports/**','admin/**','milling/**','tests/accounts-v1/**','tests/offline_recovery_audit.js','tests/super_admin_cleanup_audit.js','tests/live/accounts-hostinger-qa.spec.js','tests/live/accounts-bulk-hostinger-qa.spec.js','tests/live/hostinger-qa.spec.js','tests/live/exports-reset-only.spec.js','tests/exports-v3/**','.github/workflows/accounts-v1-qa.yml','.github/workflows/deploy-production.yml','.github/workflows/qa-data-cleanup.yml']
  pull_request:
    paths: ['index.html','accounts/**','api/**','scripts/**','auth_store.php','product_stage.php','module.php','exports/**','admin/**','milling/**','tests/accounts-v1/**','tests/offline_recovery_audit.js','tests/super_admin_cleanup_audit.js','tests/live/accounts-hostinger-qa.spec.js','tests/live/accounts-bulk-hostinger-qa.spec.js','tests/live/hostinger-qa.spec.js','tests/live/exports-reset-only.spec.js','tests/exports-v3/**','.github/workflows/accounts-v1-qa.yml','.github/workflows/deploy-production.yml','.github/workflows/qa-data-cleanup.yml']

permissions:
  contents: read

jobs:
  accounts-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: JavaScript and JSON syntax
        run: |
          find accounts exports admin tests/accounts-v1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('accounts/accounting_master_v1.json','utf8'))"
      - name: Accounts rule and control audits
        run: |
          node tests/accounts-v1/rules_engine_test.js
          node tests/accounts-v1/salary_donations_test.js
          node tests/accounts-v1/expenses_v1_test.js
          node tests/accounts-v1/reimbursements_general_expenses_test.js
          node tests/accounts-v1/other_purchases_fixed_assets_test.js
          node tests/accounts-v1/rent_recurring_test.js
          node tests/accounts-v1/journal_vouchers_test.js
          node tests/accounts-v1/end_to_end_audit.js
          node tests/accounts-v1/static_audit.js
          node tests/accounts-v1/clean_ui_test.js
          node tests/accounts-v1/export_v3_linkage_test.js
          node tests/accounts-v1/product_stage_architecture_test.js
          node tests/accounts-v1/broker_brokery_master_test.js
          node tests/offline_recovery_audit.js
      - name: PHP syntax
        run: |
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/runtime_delivery_test.php
          node tests/runtime_security_static_audit.js
