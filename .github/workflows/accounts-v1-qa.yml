          python3 tests/security/logout_http_test.py
          node tests/accounts-v1/master_role_mapping_test.js
          node tests/offline_recovery_audit.js
      - name: Private stock reconciliation rules
        run: |
          php tests/security/operations_ownership_test.php
          php tests/accounts-v1/inventory_reconciliation_test.php
          php tests/accounts-v1/rice_ledger_test.php
          python3 tests/accounts-v1/mill_rice_asset_delivery_test.py
          python3 tests/accounts-v1/rice_ledger_endpoint_test.py
