          python3 tests/accounts-v1/payment_plans_test.py
          python3 tests/accounts-v1/supplier_discount_test.py
          node tests/accounts-v1/reimbursements_general_expenses_test.js
          node tests/accounts-v1/other_purchases_fixed_assets_test.js
          php tests/accounts-v1/assets_registry_test.php
          python3 tests/accounts-v1/assets_registry_http_test.py
          node tests/accounts-v1/rent_recurring_test.js
          node tests/accounts-v1/journal_vouchers_test.js
          python3 tests/accounts-v1/jv_posting_flow_http_test.py
          node tests/accounts-v1/end_to_end_audit.js
          node tests/accounts-v1/static_audit.js
          node tests/accounts-v1/clean_ui_test.js
          node tests/master_data_topbar_audit.js
          node tests/accounts-v1/payment_defaults_ui_test.js
