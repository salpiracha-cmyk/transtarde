          python3 tests/security/mill_cash_authorization_test.py
          node tests/accounts-v1/payee_summary_escape_test.js
          node tests/runtime_security_static_audit.js

  inventory-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-only
          MYSQL_DATABASE: transtrade_qa_inventory
          MYSQL_USER: qa_inventory
          MYSQL_PASSWORD: disposable-local-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      TT_DB_HOST: 127.0.0.1
      TT_DB_NAME: transtrade_qa_inventory
      TT_DB_USER: qa_inventory
      TT_DB_PASS: disposable-local-only
      TT_QA_MYSQL: '1'
      TT_QA_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: Install isolated browser runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/inventory-venv"
          "$RUNNER_TEMP/inventory-venv/bin/pip" -q install playwright==1.55.0
          "$RUNNER_TEMP/inventory-venv/bin/playwright" install --with-deps chromium
      - name: Expense review and shared form browser flows
        run: |
          npm install --prefix "$RUNNER_TEMP/expense-review-node" --no-save playwright@1.55.0 jsdom@26
          export NODE_PATH="$RUNNER_TEMP/expense-review-node/node_modules"
          node tests/accounts-v1/console_access_preservation_test.js
