          node tests/accounts-v1/inventory_reconciliation_ui_test.js
          python3 tests/accounts-v1/inventory_reconciliation_http_test.py
      - name: PHP syntax
        run: |
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check session-activity.js
          php tests/runtime_delivery_test.php
          php tests/runtime_asset_version_test.php
          php tests/security/retired_owner_cleanup_test.php
          python3 tests/security/private_session_storage_test.py
          python3 tests/security/startup_delivery_test.py
          python3 tests/security/login_startup_latency_test.py
          python3 tests/security/authentication_boundary_test.py
          python3 tests/security/session_retention_test.py
