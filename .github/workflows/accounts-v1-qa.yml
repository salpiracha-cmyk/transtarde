          php tests/accounts-v1/supplier_cheque_lifecycle_test.php
          python3 tests/accounts-v1/supplier_opening_http_test.py
          php tests/accounts-v1/supplier_opening_core_test.php
          php tests/accounts-v1/local_customer_cheque_test.php
