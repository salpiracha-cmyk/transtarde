      - name: Carry-forward shipment form and expense payments
        run: '"$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/carry_forward_http_test.py'
      - name: Actual MySQL and restricted-user browser reconciliation
        env:
          TT_QA_OUTPUT: ${{ runner.temp }}/inventory-evidence
        run: |
          php tests/accounts-v1/freight_metadata_test.php
          python3 tests/security/mill_cash_authorization_test.py
          python3 tests/security/export_document_permissions_test.py
          "$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/inventory_reconciliation_http_test.py
      - name: Ready rice bill browser and HTTP flow
        run: '"$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/ready_rice_bill_http_test.py'
      - name: Salary month HTTP and browser flow
        run: '"$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/salary_month_http_test.py'
      - name: Bank entries, finance and subaccounts browser flow
        env:
          TT_QA_OUTPUT: ${{ runner.temp }}/inventory-evidence
        run: '"$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/bank_entries_browser_test.py'
      - name: Company investments and routed-funds browser flow
        run: '"$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/company_investments_test.py'
      - name: Property registration and instalment browser flow
        run: '"$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/assets_registry_http_test.py'
      - name: TG remittance review browser flow
        env:
          TT_QA_OUTPUT: ${{ runner.temp }}/inventory-evidence
        run: '"$RUNNER_TEMP/inventory-venv/bin/python" tests/accounts-v1/tg_remittance_http_test.py'
      - name: Retain sanitized test evidence
        continue-on-error: true # Evidence uploads are best effort; every functional check remains required.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/inventory-evidence/
          retention-days: 14

