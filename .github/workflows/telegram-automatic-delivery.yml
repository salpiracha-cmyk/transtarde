name: Telegram automatic delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-automatic-delivery.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Production']
    types: [completed]

permissions:
  contents: read
concurrency:
  group: transtrade-telegram-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run the verified hosted Telegram worker
        env:
          HOSTINGER_HOST: 151.106.116.33
          HOSTINGER_PORT: '65002'
          HOSTINGER_USER: u831010370
          HOSTINGER_DEPLOY_PATH: /home/u831010370/domains/app.transtradeinternational.com/public_html
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          expected_fingerprint='SHA256:Bid0atNrqK2cVKyC84j8BnqToKfMokX5myGJkNCvBsg'
          ssh-keyscan -T 15 -p "$HOSTINGER_PORT" -t ed25519 "$HOSTINGER_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/hostkey-candidate"
          actual_fingerprint=$(ssh-keygen -lf "$RUNNER_TEMP/ssh/hostkey-candidate" -E sha256 | awk '{print $2}' | sort -u)
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "Hostinger ED25519 fingerprint mismatch; refusing connection."
            exit 1
          fi
          mv "$RUNNER_TEMP/ssh/hostkey-candidate" "$RUNNER_TEMP/ssh/known_hosts"
          echo "HOSTINGER_ED25519_FINGERPRINT_VERIFIED=$actual_fingerprint"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          [[ "$HOSTINGER_DEPLOY_PATH" =~ ^/home/[a-zA-Z0-9_-]+/domains/app\.transtradeinternational\.com/public_html$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "cd '$HOSTINGER_DEPLOY_PATH' && test -f scripts/telegram-dispatch.php && php scripts/telegram-dispatch.php"
