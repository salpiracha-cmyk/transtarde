            test/accounts-professional-live-smoke-20260912	cb7f88441ae3d130a75270bee85f86d1ecb98640
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted=0
          preserved=0
          while IFS=$'\t' read -r branch expected_sha; do
            [ -n "$branch" ] || continue

            if [ "$branch" = "main" ]; then
              echo "::error::Safety check rejected main"
              exit 1
            fi

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Already absent: $branch"
              continue
            fi

            current_sha=$(git rev-parse "refs/remotes/origin/$branch")
            if [ "$current_sha" = "$expected_sha" ]; then
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "::warning::Preserved changed branch: $branch"
              preserved=$((preserved + 1))
            fi
          done <<< "$VERIFIED_TIPS"

          echo "Deleted $deleted exact merged pull-request branches."
          echo "Preserved $preserved changed or uncertain branches."

      - name: Remove this temporary maintenance workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-verified-squash-branches.yml
          git commit -m "Remove completed squash-branch cleanup workflow [cleanup-only]"
          git push origin HEAD:main
