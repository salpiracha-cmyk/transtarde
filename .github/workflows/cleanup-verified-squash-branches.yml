name: Cleanup verified squash-merged branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-verified-squash-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only exact merged pull-request tips
