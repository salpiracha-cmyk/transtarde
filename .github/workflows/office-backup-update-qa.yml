name: Windows office backup updater syntax
on:
  pull_request:
    paths: ['.github/scripts/windows_office_backup_update.ps1', 'scripts/install_office_backup_schedule.ps1', 'scripts/connect_office_pc.ps1', 'scripts/office_backup_agent.py', 'tests/security/office_backup_agent_test.py', 'tests/security/office_backup_task_owner_test.ps1', '.github/workflows/office-backup-update-qa.yml']
  push:
    branches: [main]
    paths: ['.github/scripts/windows_office_backup_update.ps1', 'scripts/install_office_backup_schedule.ps1', 'scripts/connect_office_pc.ps1', 'scripts/office_backup_agent.py', 'tests/security/office_backup_agent_test.py', 'tests/security/office_backup_task_owner_test.ps1', '.github/workflows/office-backup-update-qa.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual Windows backup locking and state commits
        run: python tests/security/office_backup_agent_test.py
      - shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/scripts/windows_office_backup_update.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; throw 'Updater contains syntax errors.' }
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/connect_office_pc.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; throw 'PC connection setup contains syntax errors.' }
          Write-Host 'WINDOWS_UPDATER_SYNTAX_OK'
          & (Join-Path $PWD 'tests/security/office_backup_task_owner_test.ps1')
