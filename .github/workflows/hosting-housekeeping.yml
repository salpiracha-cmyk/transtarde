name: Hosting folder housekeeping
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hosting-housekeeping.yml']
permissions:
  contents: read
concurrency:
  group: transtrade-production-deployment
  cancel-in-progress: false
jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restrict direct access to private JSON files
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash -n .github/scripts/hosting_housekeeping.sh
          [[ "$HOSTINGER_DEPLOY_PATH" =~ ^/home/[a-zA-Z0-9_-]+/domains/app\.transtradeinternational\.com/public_html$ ]]
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh -o ConnectTimeout=20 -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "bash -s -- '$HOSTINGER_DEPLOY_PATH' protect-json" < .github/scripts/hosting_housekeeping.sh
      - name: Verify public requests are denied and login still loads
        run: |
          set -euo pipefail
          base=https://app.transtradeinternational.com
          for file in accounts/accounting_master_v1.json directors/costing-profiles.json; do
            for suffix in "" "?verification=$GITHUB_SHA"; do
              code=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base/$file$suffix")
              printf '%s HTTP %s\n' "$file" "$code"
              [[ "$code" == 403 ]]
            done
          done
          [[ "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base/login.php")" == 200 ]]
      - name: Remove generated deployment staging and upload copies
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$HOSTINGER_DEPLOY_PATH" =~ ^/home/[a-zA-Z0-9_-]+/domains/app\.transtradeinternational\.com/public_html$ ]]
          php .github/scripts/deployment_cache_audit_test.php
          ssh -o ConnectTimeout=20 -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "bash -s -- '$HOSTINGER_DEPLOY_PATH'" <<'REMOTE'
          set -eu
          target=$1
          [[ "$(realpath "$target")" == "$target" ]] && echo 'Live root is canonical'
          root="${target%/public_html}/.transtrade-deploy"
          for dir in "$root" "$root/incoming" "$root/staging"; do
            if [[ -d "$dir" && ! -L "$dir" && "$(realpath "$dir")" == "$dir" ]]; then
              printf 'Canonical directory: %s\n' "${dir##*/}"
              du -sb "$dir" | cut -f1
            else
              printf 'Missing or noncanonical directory: %s\n' "${dir##*/}"
            fi
          done
          if [[ -f "$target/.transtrade-release" ]] && grep -Eq '^[a-f0-9]{40}$' "$target/.transtrade-release"; then
            echo 'Release marker is present and well formed'
          else
            echo 'Release marker is missing or malformed'
          fi
          REMOTE
          ssh -o ConnectTimeout=20 -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "php /dev/stdin '$HOSTINGER_DEPLOY_PATH' --cleanup" < .github/scripts/deployment_cache_audit.php
