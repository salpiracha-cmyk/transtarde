name: Gemini Private Key Fallback

on:
  push:
    branches: [gemini-document-reader]
    paths: ['scripts/add_gemini_private_key_fallback.py']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gemini-document-reader
      - name: Patch private key fallback
        run: |
          set -euo pipefail
          python3 scripts/add_gemini_private_key_fallback.py
          php -l api/document_ai.php
      - name: Commit patched reader
        run: |
          set -euo pipefail
          git config user.name 'transtrade-gemini-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/document_ai.php
          git commit -m 'Allow Gemini key from private server storage'
          git push origin HEAD:gemini-document-reader
