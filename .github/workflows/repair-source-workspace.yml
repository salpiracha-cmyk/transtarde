name: Repair Source Workspace
on:
  push:
    branches: ['repair/whole-app-linkages-20260921']
    paths: ['.github/workflows/repair-source-workspace.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dce868fd82e136167e97d2717938940b2d4fcc48
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dce868fd82e136167e97d2717938940b2d4fcc48
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | gzip > "$RUNNER_TEMP/source/source-dce868f.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source/manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source-dce868f
          path: ${{ runner.temp }}/source/
          retention-days: 1
