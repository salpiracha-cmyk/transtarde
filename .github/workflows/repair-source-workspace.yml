name: Repair Source Workspace
on:
  push:
    branches: ['repair/whole-app-linkages-20260921']
    paths: ['.github/workflows/repair-source-workspace.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 473dd05045882de54218e4a147a32f04de7d39f0
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 473dd05045882de54218e4a147a32f04de7d39f0
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | gzip > "$RUNNER_TEMP/source/source-473dd05.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source/manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source-473dd05
          path: ${{ runner.temp }}/source/
          retention-days: 1
