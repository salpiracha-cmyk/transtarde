name: Validate original bag source readiness (read only)
on:
  push:
    branches: [review/bag-source-readiness-20261018]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing verified production connection
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Read historical bag scope and holds without changing application data
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          ACCOUNT: ${{ secrets.HOSTINGER_USER }}
          TARGET: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          case "$TARGET" in /home/*/domains/app.transtradeinternational.com/public_html) ;; *) exit 1;; esac
          ssh -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$PORT" "$ACCOUNT@$HOST" bash -s -- "$TARGET" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          php <<'PHP'
          <?php
          $stage='setup';set_exception_handler(static function(Throwable $e)use(&$stage):void{echo json_encode(['failedStage'=>$stage,'errorClass'=>get_class($e)])."\n";exit(1);});
          $live=getcwd();$private=dirname($live).'/transtrade_private';$review=dirname($live).'/.bag-source-review-'.bin2hex(random_bytes(8));
          if(!mkdir($review,0700))throw new RuntimeException('Private source review unavailable.');
          try{
          if(file_put_contents($review.'/bag_inventory_core.php',base64_decode('',true))===false)throw new RuntimeException('Source copy failed.');
           if(file_put_contents($review.'/bag_transfer_core.php',base64_decode('',true))===false)throw new RuntimeException('Source copy failed.');
           if(file_put_contents($review.'/bag_acceptance_core.php',base64_decode('',true))===false)throw new RuntimeException('Source copy failed.');
           if(file_put_contents($review.'/bag_receipt_quantities.php',base64_decode('',true))===false)throw new RuntimeException('Source copy failed.');
           require_once $live.'/product_stage.php';require_once $live.'/master_store.php';
           require_once $review.'/bag_inventory_core.php';
           $stage='read-sources';
           $read=static function(string $path):array{$h=fopen($path,'rb');if(!$h||!flock($h,LOCK_SH))throw new RuntimeException('Source unavailable.');try{return json_decode(stream_get_contents($h),true,512,JSON_THROW_ON_ERROR);}finally{flock($h,LOCK_UN);fclose($h);}};
           $auth=$read($private.'/auth.json');$ops=$read($private.'/operations.json');$masters=tt_normalize_masters((array)($auth['masters']??[]));$values=(array)($ops['values']??[]);$state=$values['tt41bagtransfers']??'[]';$state=is_string($state)?json_decode($state,true,512,JSON_THROW_ON_ERROR):$state;
           $date=(new DateTimeImmutable('now',new DateTimeZone('Asia/Karachi')))->format('Y-m-d');
           $summary=['readOnly'=>true,'operationsRevision'=>$ops['revision']??null,'orders'=>count(bti_rows($values,'tt30bags')),'receipts'=>count(bti_rows($values,'tt33bagreceipts')),'productionRuns'=>count(bti_rows($values,'tt30prod')),'scopes'=>[]];
           $stage='project-scopes';
           foreach(['TTI','BRM'] as $entity)foreach((array)($masters['mills']??[]) as $mill){
            $v=array_values((array)($mill['values']??[]));$scope=['entity'=>$entity,'locationId'=>(string)$mill['id'],'millName'=>(string)($v[0]??'')];
            $view=bti_project($values,$masters,$scope,$date,$date,(array)$state);if(!$view['lots']&&!$view['unallocatedConsumption']&&!$view['warnings'])continue;
            $holds=[];$balance=0;$available=0;$heldBalance=0;$held=0;
            foreach($view['lots'] as $lot){$balance+=$lot['balanceBeforeUnallocated'];if($lot['availableQty']===null){$held++;$heldBalance+=$lot['balanceBeforeUnallocated'];}else{$available+=$lot['availableQty'];}foreach($lot['holds'] as $hold)$holds[$hold]=($holds[$hold]??0)+1;}
            $summary['scopes'][]=['entity'=>$entity,'locationIdentityHash'=>substr(hash('sha256',$scope['locationId']),0,16),'lotCount'=>count($view['lots']),'heldLots'=>$held,'physicalBalance'=>$balance,'heldBalance'=>$heldBalance,'availableBalance'=>$available,'unallocatedConsumptionCount'=>count($view['unallocatedConsumption']),'warnings'=>$view['warnings'],'holdReasons'=>$holds];
           }
           echo json_encode($summary,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n";
          }finally{
           foreach(glob($review.'/*')?:[] as $file)if(is_file($file))unlink($file);
           if(is_dir($review))rmdir($review);
          }
          echo "PRIVATE_SOURCE_REVIEW_REMOVED=true\n";
          PHP
          REMOTE
