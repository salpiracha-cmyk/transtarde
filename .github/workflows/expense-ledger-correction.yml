name: Owner-approved expense ledger correction

on:
  pull_request:
    paths: ['.github/workflows/expense-ledger-correction.yml', '.github/scripts/expense_ledger_correct*', '.github/expense-ledger-plan.json']
  push:
    branches: [main]
    paths: ['.github/workflows/expense-ledger-correction.yml', '.github/scripts/expense_ledger_correct*', '.github/expense-ledger-plan.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual native corrections on disposable books
        run: |
          php -l .github/scripts/expense_ledger_correct.php
          php .github/scripts/expense_ledger_review_test.php
          python3 .github/scripts/expense_ledger_correct_test.py
  correct:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply the exact authorised correction manifest
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          REVIEW_KEY_B64: ''
          CORRECTION_MODE: APPLY
          APPROVED_MANIFEST_SHA256: '9e502f44c775aaadc2817e41004b6125876b24cf55cdbf9d2cf0daf3d324f39a'
        run: |
          set -euo pipefail
          case "$HOSTINGER_DEPLOY_PATH" in /home/*/domains/app.transtradeinternational.com/public_html) ;; *) exit 1 ;; esac
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          python3 - <<'PY'
          import pathlib,os
          shared=pathlib.Path('.github/scripts/expense_ledger_review.php').read_text().split("\nif(defined('TT_EXPENSE_REVIEW_LIBRARY'))return;")[0]
          source=pathlib.Path('.github/scripts/expense_ledger_correct.php').read_text()
          prefix="<?php\ndeclare(strict_types=1);\n"
          assert source.startswith(prefix)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'expense-correction-driver.php').write_text(shared+'\n'+source[len(prefix):])
          PY
          php -l "$RUNNER_TEMP/expense-correction-driver.php"
          manifest=$(base64 -w0 .github/expense-ledger-plan.json)
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "TT_EXPENSE_REVIEW_ROOT='$HOSTINGER_DEPLOY_PATH' TT_EXPENSE_REVIEW_PUBLIC_KEY_B64='$REVIEW_KEY_B64' TT_EXPENSE_CORRECTION_MANIFEST_B64='$manifest' TT_EXPENSE_CORRECTION_MODE='$CORRECTION_MODE' TT_EXPENSE_CORRECTION_APPROVED_SHA256='$APPROVED_MANIFEST_SHA256' php" < "$RUNNER_TEMP/expense-correction-driver.php" > "$RUNNER_TEMP/expense-correction-result.encrypted.json"
          echo 'Native correction result encrypted; no financial records printed.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expense-correction-result-${{ github.run_id }}
          path: ${{ runner.temp }}/expense-correction-result.encrypted.json
          if-no-files-found: ignore
          retention-days: 1
