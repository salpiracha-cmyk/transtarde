name: Milling and Exports QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'exports/**'
      - 'milling/**'
      - 'module.php'
      - 'module_release.php'
      - '.htaccess'
      - 'customer-contract-options.js'
      - 'global-validation.js'
      - 'milling-quality-identity.js'
      - 'api/**'
      - 'auth_store.php'
      - 'customer-master.js'
      - 'admin/app.js'
      - 'tests/**'
      - '.github/workflows/milling-exports-qa.yml'
      - '.github/workflows/live-hostinger-qa.yml'
      - '.github/workflows/exports-deletion-hostinger-qa.yml'
      - '.github/workflows/accounts-v1-qa.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/qa-data-cleanup.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'exports/**'
      - 'milling/**'
      - 'module.php'
      - 'module_release.php'
      - '.htaccess'
      - 'customer-contract-options.js'
      - 'global-validation.js'
      - 'milling-quality-identity.js'
      - 'api/**'
      - 'auth_store.php'
      - 'customer-master.js'
      - 'admin/app.js'
      - 'tests/**'
      - '.github/workflows/milling-exports-qa.yml'
      - '.github/workflows/live-hostinger-qa.yml'
      - '.github/workflows/exports-deletion-hostinger-qa.yml'
      - '.github/workflows/accounts-v1-qa.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/qa-data-cleanup.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated audit workspace
        run: |
          cp exports/app.js tests/exports-v3/app.js
          cp exports/app.css tests/exports-v3/app.css
          cp exports/index.html tests/exports-v3/index.html
          mkdir -p tests/exports-v3/assets tests/main/api
          cp exports/assets/* tests/exports-v3/assets/
          cp module.php tests/main/module.php
          cp api/operations.mysql.php api/export_documents.php tests/main/api/
      - name: Install browser and DOM test dependencies
        run: |
          npm install --no-save jsdom@27 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify exact September document-output acceptance
        run: |
          node tests/exports-v3/exports_acceptance_20260914_audit.js
          node tests/exports-v3/exports_sol4_handover_audit.js
          node tests/exports-v3/commercial_documents_20260915_audit.js
          node tests/exports-v3/document_rules_20260917_audit.js
      - name: Verify rendered Export document behavior
        run: |
          node tests/exports-v3/export_release_test.js
          node tests/exports-v3/sales_contract_browser_qa.js
          node tests/exports-v3/shipment_documents_browser_qa.js
      - name: Preserve Export visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-document-browser-qa
          path: tmp/qa/
          if-no-files-found: error
      - name: Run Export and bridge audits
        run: |
          node tests/exports-v3/backend_static_audit.js
          node tests/exports-v3/bridge_integration_test.js
          node tests/exports-v3/browser_dom_audit.js
          node tests/exports-v3/focus_preservation_browser_qa.js
          node tests/exports-v3/export_master_icons_audit.js
          node tests/exports-v3/export_entry_ux_audit.js
          node tests/exports-v3/deletion_server_ack_audit.js
          node tests/exports-v3/new_contract_reset_audit.js
          node tests/exports-v3/full_workflow_audit.js
          node tests/exports-v3/import_master_audit.js
          node tests/exports-v3/lot_completion_stage_audit.js
          node tests/exports-v3/strengthened_workflow_audit.js
          node tests/exports-v3/tg_route_audit.js
          node tests/exports-v3/tti_qa02_closure_audit.js
          node tests/exports-v3/v3_dummy_workflow_audit.js
          node tests/exports_v32_corrections_audit.js
          node tests/milling_container_audit.js
          node tests/master_data_topbar_audit.js
          node tests/offline_recovery_audit.js
          node tests/super_admin_cleanup_audit.js
      - name: Audit live release route
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const htaccess = fs.readFileSync('.htaccess', 'utf8');
          const release = fs.readFileSync('module_release.php', 'utf8');
          const options = fs.readFileSync('customer-contract-options.js', 'utf8');
          assert.match(htaccess, /RewriteRule \^module\\\.php\$ module_release\.php \[L\]/);
          assert.match(release, /require __DIR__ \. '\/module\.php';/);
          assert.match(release, /customer-contract-options\.js\?v=20260911-reports-1/);
          assert.doesNotMatch(options, /enforceApprovedReports/);
          assert.match(options, /function releaseDomTweaks\(\)\{hydrateEditor\(\)\}/);
          console.log('Live release route and report compatibility audit passed.');
          NODE
      - name: PHP syntax audit
        run: |
          php tests/runtime_delivery_test.php
          php -l module.php
          php -l runtime_html.php
          php -l module_release.php
          php -l api/operations.mysql.php
          php -l api/export_documents.php
          php -l auth_store.php
          php -l scripts/cleanup_qa_data.php
      - name: Runtime delivery and authentication audit
        run: node tests/runtime_security_static_audit.js
