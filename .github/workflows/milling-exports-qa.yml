name: Milling and Exports QA

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'document-filenames.js'
      - 'document_filenames.php'
      - 'index.html'
      - 'index.php'
      - 'jv_notice_ui.php'
      - 'staff-home.php'
      - 'document-reader-settings.php'
      - 'admin/document-reader*'
      - 'exports/**'
      - 'accounts/**'
      - 'milling/**'
      - 'exporter-loading.php'
      - 'module.php'
      - 'brand-theme.css'
      - 'brand-theme.js'
      - 'offline_idempotency.php'
      - 'module_release.php'
      - '.htaccess'
      - 'customer-contract-options.js'
      - 'global-validation.js'
      - 'milling-quality-identity.js'
      - 'api/**'
      - 'auth_store.php'
      - 'session_store.php'
      - 'login.php'
      - 'change-password.php'
      - 'recover-admin.php'
      - 'logout.php'
      - 'master_store.php'
      - 'backup_lib.php'
      - 'restore_jobs.php'
      - 'restore.php'
      - 'admin/restore.js'
      - 'office_backup_auth.php'
      - 'scripts/office_backup_agent.py'
      - 'scripts/windows_backup_app.py'
      - 'scripts/backup_recovery_reader.py'
      - 'office_pc_pairing.php'
      - 'connect-backup-pc.php'
      - 'tests/security/windows_backup_app_test.py'
      - 'tests/security/pc_pairing_test.php'
      - 'qa_account.php'
      - 'customer-master.js'
      - 'admin/app.js'
      - 'tests/**'
      - '.github/workflows/milling-exports-qa.yml'
      - '.github/workflows/live-hostinger-qa.yml'
      - '.github/workflows/exports-deletion-hostinger-qa.yml'
      - '.github/workflows/accounts-v1-qa.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/qa-data-cleanup.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated audit workspace
        run: |
          cp exports/app.js tests/exports-v3/app.js
          cp exports/app.css tests/exports-v3/app.css
          cp exports/index.html tests/exports-v3/index.html
          mkdir -p tests/exports-v3/assets tests/main/api
          cp exports/assets/* tests/exports-v3/assets/
          cp module.php tests/main/module.php
          cp api/operations.mysql.php api/export_documents.php tests/main/api/
      - name: Install browser and DOM test dependencies
        run: |
          sudo python3 .github/scripts/browser-download-setup.py
          npm install --no-save jsdom@27 playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Verify live credential artifact boundary with disposable login
        run: node tests/security/live_credential_artifact_browser_test.js
      - name: Verify document reader settings controls
        run: node tests/document-ai/settings_ui_test.js
      - name: Verify lot persistence and reopening permissions
        run: |
          node tests/exports-v3/shared_save_persistence_test.js
          node tests/exports-v3/fi_action_ack_browser_test.js
          php tests/exports-v3/contract_cancellation_merge_test.php
          node tests/exports-v3/export_corrections_20260916_audit.js
          node tests/exports-v3/export_operational_input_audit.js
          node tests/exports-v3/lot_reopen_permission_test.js
          node tests/exports-v3/lot_completion_persistence_browser_qa.js
      - name: Verify exact September document-output acceptance
        run: |
          TT_FILENAME_BROWSER=1 node tests/document_filenames_test.js
          php tests/document_filenames_test.php
          node tests/exports-v3/exports_acceptance_20260914_audit.js
          node tests/exports-v3/exports_sol4_handover_audit.js
          node tests/exports-v3/commercial_documents_20260915_audit.js
          node tests/exports-v3/document_rules_20260917_audit.js
          TT_TG_PACK_BROWSER=1 node tests/exports-v3/tg_pack_preview_test.js
          python3 tests/exports-v3/tg_bank_stamp_registration_test.py
          node tests/exports-v3/tg_cover_output_test.js
          node tests/exports-v3/document_variant_matrix_test.js
          node tests/exports-v3/customer_reference_linkages_test.js
          node tests/exports-v3/untrusted_date_currency_test.js
          node tests/exports-v3/shipment_copy_reuse_test.js
          node tests/exports-v3/office_delivery_browser_test.js
          python3 tests/security/office_delivery_http_test.py
      - name: Verify rendered Export document behavior
        run: |
          node tests/accounts-v1/dependent_fields_test.js
          node tests/accounts-v1/form_viewport_browser_test.js
          node tests/accounts-v1/expense_forms_browser_test.js
          node tests/accounts-v1/direct_expense_browser_test.js
          node tests/accounts-v1/payment_plans_browser_test.js
          node tests/accounts-v1/bank_save_browser_qa.js
          node tests/accounts-v1/today_ui_browser_qa.js
          node tests/exports-v3/export_release_test.js
          node tests/exports-v3/sales_contract_browser_qa.js
          node tests/exports-v3/shipment_documents_browser_qa.js
          node tests/exports-v3/coo_master_refresh_20260930_audit.js
          node tests/exports-v3/completed_reprint_test.js
          node tests/exports-v3/completed_print_permissions_test.js
          node tests/exports-v3/final_documents_20260930_browser_qa.js
          node tests/exports-v3/shipment_package_20261001_browser_qa.js
          php tests/security/office_generated_pdf_test.php
      - name: Preserve Export visual QA evidence
        continue-on-error: true # Screenshot storage quota must not override functional test results.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-document-browser-qa
          path: tmp/qa/
          if-no-files-found: error
      - name: Run Export and bridge audits
        run: |
          node tests/exports-v3/header_lifecycle_test.js
          node tests/exports-v3/backend_static_audit.js
          node tests/exports-v3/bridge_integration_test.js
          node tests/exports-v3/corn_bridge_test.js
          node tests/milling_exporter_broker_test.js
          node tests/exports-v3/browser_dom_audit.js
          node tests/exports-v3/fi_register_layout_browser_test.js
          node tests/exports-v3/focus_preservation_browser_qa.js
          node tests/exports-v3/export_master_icons_audit.js
          node tests/exports-v3/export_entry_ux_audit.js
          node tests/exports-v3/deletion_server_ack_audit.js
          node tests/exports-v3/new_contract_reset_audit.js
          node tests/exports-v3/full_workflow_audit.js
          node tests/exports-v3/import_master_audit.js
          node tests/exports-v3/lot_completion_stage_audit.js
          node tests/exports-v3/strengthened_workflow_audit.js
          node tests/exports-v3/tg_route_audit.js
          node tests/exports-v3/tti_qa02_closure_audit.js
          node tests/exports-v3/v3_dummy_workflow_audit.js
          node tests/exports_v32_corrections_audit.js
          node tests/milling_container_audit.js
          node tests/exmill_instruction_authority_test.js
          node tests/exmill_product_matching_test.js
          node tests/exmill_form_stability_browser_qa.js
          node tests/master_data_topbar_audit.js
          node tests/offline_recovery_audit.js
          node tests/super_admin_cleanup_audit.js
      - name: Audit live release route
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const htaccess = fs.readFileSync('.htaccess', 'utf8');
          const release = fs.readFileSync('module_release.php', 'utf8');
          const options = fs.readFileSync('customer-contract-options.js', 'utf8');
          assert.doesNotMatch(htaccess, /RewriteRule \^module\\\.php\$ module_release\.php \[L\]/);
          assert.match(release, /require __DIR__ \. '\/module\.php';/);
          assert.doesNotMatch(release, /str_replace|preg_replace|ob_start/);
          const module = fs.readFileSync('module.php', 'utf8');
          assert.match(module, /customer-contract-options\.js\?v=20260911-reports-1/);
          assert.match(module, /global-validation\.js\?v=20260909-1/);
          assert.doesNotMatch(options, /enforceApprovedReports/);
          assert.match(options, /function releaseDomTweaks\(\)\{hydrateEditor\(\)\}/);
          console.log('Live release route and report compatibility audit passed.');
          NODE
      - name: PHP syntax audit
        run: |
          php tests/runtime_delivery_test.php
          python3 tests/operations_compression_http_test.py
          python3 tests/export_asset_delivery_http_test.py
          php tests/runtime_asset_version_test.php
          php tests/security/retired_owner_cleanup_test.php
          python3 tests/security/private_session_storage_test.py
          python3 tests/security/corrupt_session_recovery_test.py
          python3 tests/security/authentication_boundary_test.py
          python3 tests/security/session_retention_test.py
          python3 tests/security/entity_icon_authorization_test.py
          python3 tests/security/api_workflow_authorization_test.py
          TT_QA_HTTP_DOCS=1 python3 tests/security/export_document_permissions_test.py
          node tests/accounts-v1/payee_summary_escape_test.js
          node tests/accounts-v1/director_bank_approval_ui_test.js
          php -l module.php
          php -l runtime_html.php
          php -l module_release.php
          php -l api/operations.mysql.php
          php -l api/export_documents.php
          php -l auth_store.php
          php -l master_store.php
          php -l backup_lib.php
          php tests/security/module_business_backup_test.php
          php tests/security/readable_backup_reports_test.php
          python3 tests/security/backup_plan_test.py
          php tests/security/server_backup_hardening_test.php
          php tests/security/website_restore_test.php
          php -d memory_limit=512M tests/security/website_restore_large_test.php
          python3 tests/security/website_restore_http_test.py
          node tests/security/website_restore_ui_test.js
          php tests/security/upload_validation_test.php
          php tests/security/pc_pairing_test.php
          python3 tests/security/pc_pairing_http_test.py
          php tests/security/owner_backup_jobs_test.php
          php tests/security/office_backup_auth_test.php
          python3 tests/security/office_backup_agent_test.py
          python3 tests/security/office_backup_protocol_test.py
          python3 tests/security/logout_http_test.py
          php -l scripts/cleanup_qa_data.php
      - name: Runtime delivery and authentication audit
        run: node tests/runtime_security_static_audit.js


      - name: Retain packing copy-label visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packing-label-${{ github.run_id }}
          path: |
            tmp/qa/final-files-20260930/packing-copy-label-flow.png
            tmp/qa/final-files-20260930/packing-copy-label-flow.pdf
          if-no-files-found: ignore
          retention-days: 7

  windows-backup-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', architecture: 'x64'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'openssl, mbstring, zip'}
      - name: Install pinned build dependencies
        run: python -m pip install pyinstaller==6.22.3 cryptography==50.0.2
      - name: Check Windows tasks, shortcuts and actual PHP recovery interoperability
        env:
          TT_QA_WINDOWS_TASKS: '1'
        run: |
          python tests/security/windows_backup_app_test.py
          python tests/security/backup_plan_test.py
      - name: Build one-file Windows app with its original icon
        shell: pwsh
        run: |
          python scripts/windows_backup_app.py --build-icon backup-app.ico
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths . --name TranstradeBackupSetup --icon backup-app.ico scripts/windows_backup_app.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows app build failed.' }
          $report = Join-Path $env:RUNNER_TEMP 'backup-app-self-test.json'
          $process = Start-Process -FilePath '.\dist\TranstradeBackupSetup.exe' -ArgumentList @('--self-test-report', ('"' + $report + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Built EXE could not start.' }
          $proof = Get-Content $report -Raw | ConvertFrom-Json
          if (!$proof.frozen -or !$proof.tkinter -or !$proof.encryption -or !$proof.guiLayout -or $proof.platform -ne 'Windows') { throw 'Built EXE runtime check failed.' }
          @{sha256=(Get-FileHash dist/TranstradeBackupSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant(); releaseCommit=(git rev-parse HEAD).Trim()} | ConvertTo-Json | Set-Content dist/TranstradeBackupSetup.manifest.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: transtrade-windows-setup
          path: |
            dist/TranstradeBackupSetup.exe
            dist/TranstradeBackupSetup.manifest.json
          retention-days: 14
          if-no-files-found: error
