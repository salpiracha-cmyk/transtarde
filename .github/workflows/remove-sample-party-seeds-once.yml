name: Remove Sample Party Seeds Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-sample-party-seeds-once.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove obsolete seeded Parties from source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('auth_store.php')
          s=p.read_text()
          old="        'parties'=>[['id'=>'parties-1','values'=>['Shams','BRK-001','Broker']],['id'=>'parties-2','values'=>['Sample Overseas Buyer','BUY-001','Export buyer']]],"
          new="        'parties'=>[],"
          if old not in s:
              raise SystemExit('Expected legacy Party seed line not found; refusing broad edit.')
          s=s.replace(old,new,1)
          if 'Sample Overseas Buyer' in s or "['Shams','BRK-001','Broker']" in s:
              raise SystemExit('Legacy sample Party seed still present.')
          p.write_text(s)
          PY
          php -l auth_store.php
      - name: Commit clean source and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'salman'
          git config user.email 'salpiracha@gmail.com'
          git rm .github/workflows/remove-sample-party-seeds-once.yml
          git add auth_store.php
          git commit -m 'Stop reseeding sample Parties'
          git push origin HEAD:main
