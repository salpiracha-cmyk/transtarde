name: Retire obsolete container-only Accounts queue messages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transtrade-production-deployment
  cancel-in-progress: false
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive obsolete draft messages and verify financial sources unchanged
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          case "$HOSTINGER_DEPLOY_PATH" in /home/*/domains/app.transtradeinternational.com/public_html) ;; *) exit 1 ;; esac
          php tests/accounts-v1/exmill_queue_test.php
          node tests/accounts-v1/exmill_queue_lifecycle_test.js
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          core_sha=$(sha256sum api/exmill_queue_core.php | cut -d' ' -f1)
          bridge_sha=$(sha256sum accounts/source-bridge.js | cut -d' ' -f1)
          endpoint_sha=$(sha256sum api/bridge_outbox.php | cut -d' ' -f1)
          ssh -o ConnectTimeout=20 -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "TT_QUEUE_ROOT='$HOSTINGER_DEPLOY_PATH' TT_QUEUE_CORE_SHA='$core_sha' TT_QUEUE_BRIDGE_SHA='$bridge_sha' TT_QUEUE_ENDPOINT_SHA='$endpoint_sha' php" < .github/scripts/retire_exmill_draft_queue.php
