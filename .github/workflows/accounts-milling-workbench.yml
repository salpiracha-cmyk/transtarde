name: Accounts Milling Workbench
on:
  push:
    branches: ['qa/accounts-milling-20260920']
    paths: ['.github/workflows/accounts-milling-workbench.yml']
permissions:
  contents: read
jobs:
  test-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline DOM test dependencies
        run: |
          cd "$RUNNER_TEMP"
          mkdir dom-tests && cd dom-tests
          npm install --ignore-scripts --no-audit --no-fund jsdom@27.0.0
          tar -czf "$RUNNER_TEMP/dom-test-dependencies.tgz" node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: dom-test-dependencies
          path: ${{ runner.temp }}/dom-test-dependencies.tgz
          retention-days: 1
