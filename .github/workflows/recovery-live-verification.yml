name: Read-only final Accounts and recovery verification

on:
  push:
    branches: [codex/recovery-live-verification]

permissions:
  contents: read

concurrency:
  group: recovery-live-final-verification
  cancel-in-progress: true

jobs:
  accounts-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59f2b13a1e16181d224813020fabe29ca78dc519
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QA secrets
        env:
          QA_USERNAME: ${{ secrets.TRANSTRADE_QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.TRANSTRADE_QA_PASSWORD }}
        run: |
          test -n "$QA_USERNAME" || { echo "Missing TRANSTRADE_QA_USERNAME"; exit 1; }
          test -n "$QA_PASSWORD" || { echo "Missing TRANSTRADE_QA_PASSWORD"; exit 1; }
      - name: Install browser runtime
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
      - name: Run authenticated read-only Accounts smoke test
        env:
          TRANSTRADE_BASE_URL: https://app.transtradeinternational.com
          TRANSTRADE_QA_USERNAME: ${{ secrets.TRANSTRADE_QA_USERNAME }}
          TRANSTRADE_QA_PASSWORD: ${{ secrets.TRANSTRADE_QA_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/live/accounts-hostinger-qa.spec.js tests/live/deployed-reports-review.spec.js --reporter=line,html
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: accounts-live-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

