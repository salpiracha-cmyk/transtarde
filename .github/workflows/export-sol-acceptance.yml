name: Export SOL Acceptance

on:
  push:
    branches: [exports-clean-v1]
    paths:
      - 'exports/**'
      - 'module.php'
      - 'api/operations.php'
      - '.github/workflows/export-sol-acceptance.yml'
  pull_request:
    paths:
      - 'exports/**'
      - 'module.php'
      - 'api/operations.php'
      - '.github/workflows/export-sol-acceptance.yml'

permissions:
  contents: read

jobs:
  export-static-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify Export bundle resources
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 1 18); do
            test -s "exports/app.part${n}.txt" || { echo "Missing exports/app.part${n}.txt"; exit 1; }
          done
          for f in app.css sol-fixes.css app.js index.html Transtrade_Exports_Master_Prototype_V2_6_Final_Stabilized.html; do
            test -s "exports/$f" || { echo "Missing exports/$f"; exit 1; }
          done
          for f in TTI_header.png TTI_sign.png BRM_header.png BRM_sign.png TG_header.png TG_footer.png TG_sign.png; do
            test -s "exports/assets/$f" || { echo "Missing exports/assets/$f"; exit 1; }
          done

      - name: Assemble real Export JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/transtrade-export-bundle.js
          for n in $(seq -w 1 16); do cat "exports/app.part${n}.txt" >> /tmp/transtrade-export-bundle.js; done
          cat exports/app.part18.txt >> /tmp/transtrade-export-bundle.js
          cat exports/app.part17.txt >> /tmp/transtrade-export-bundle.js

      - name: Preserve assembled bundle for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: export-sol-assembled-bundle
          path: /tmp/transtrade-export-bundle.js
          retention-days: 3

      - name: Validate real Export JavaScript bundle syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/transtrade-export-bundle.js
          node --check exports/app.js

      - name: Verify authenticated route carries release CSS
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'exports/sol-fixes.css' exports/Transtrade_Exports_Master_Prototype_V2_6_Final_Stabilized.html
          grep -q '#ttUserBar{display:none!important}' exports/sol-fixes.css
          grep -q '#ttSyncNotice{display:none!important}' exports/sol-fixes.css
          grep -q 'app.part18.txt' exports/app.js

      - name: Verify locked downstream release markers
        shell: bash
        run: |
          set -euo pipefail
          cat exports/app.part*.txt > /tmp/export-source.txt
          grep -q 'GENERATE PO PDF & SEND TO MILL' /tmp/export-source.txt
          grep -q 'PRODUCTION INSTRUCTIONS ALREADY SENT' /tmp/export-source.txt
          grep -q 'SEND PRODUCTION INSTRUCTIONS TO MILL' /tmp/export-source.txt
          grep -q 'CREATE LOT AND SEND INSTRUCTIONS TO MILL' /tmp/export-source.txt
          grep -q 'LOADING FROM' /tmp/export-source.txt
          grep -q 'FI Register / FI Utilisation' /tmp/export-source.txt
          grep -q 'Container / Loading Register' /tmp/export-source.txt
          grep -q 'BANK COVERING — LAST' /tmp/export-source.txt
          grep -q 'DEFERRED PAYMENT L/C IS NOT ACCEPTABLE' /tmp/export-source.txt
          grep -q 'TG customer selling price will not be inferred' /tmp/export-source.txt
          grep -q 'FI allocation(s) and Bank/IBAN may appear together' /tmp/export-source.txt

      - name: Lint shared route and persistence PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l module.php
          php -l api/operations.php

      - name: Install Chromium acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Export browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/transtrade-export-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/exports/app.js >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then cat /tmp/transtrade-export-http.log; exit 1; fi
            sleep 0.25
          done
          npx playwright test exports/tests/export-sol.spec.js --reporter=line --workers=1

      - name: Confirm acceptance-only workflow
        shell: bash
        run: |
          set -euo pipefail
          echo 'This job only checks source, syntax, resources, PHP lint and local-browser behavior. It contains no publish or hosting action.'
