name: Identify requested duplicate production without exposing records
on:
  push:
    branches: [codex/mill-duplicate-owner-review]
permissions:
  contents: read
concurrency:
  group: transtrade-production-deployment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92350958b0a51bcf3a8cdd0387c09fedb39cd3dd
      - name: Verify exact live source and moved folders without writing business data
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$HOSTINGER_DEPLOY_PATH" =~ ^/home/[a-zA-Z0-9_-]+/domains/app\.transtradeinternational\.com/public_html$ ]]
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          target_q=$(printf '%q' "$HOSTINGER_DEPLOY_PATH")
          ssh -o ConnectTimeout=20 -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "TT_REVIEW_TARGET=$target_q php" <<'PHP'
          <?php
          $private=dirname(getenv('TT_REVIEW_TARGET')).'/transtrade_private';
          $read=static function($path){$h=fopen($path,'rb');if(!$h||!flock($h,LOCK_SH))throw new RuntimeException('Review source unavailable');try{return json_decode(stream_get_contents($h),true,512,JSON_THROW_ON_ERROR);}finally{flock($h,LOCK_UN);fclose($h);}};
          $auth=$read($private.'/auth.json');$ops=$read($private.'/operations.json');$values=$ops['values'];
          $rows=static fn($key)=>json_decode($values[$key]??'[]',true,512,JSON_THROW_ON_ERROR);
          $requested=[];foreach($auth['users'] as $u)if(str_contains(strtolower((string)($u['full_name']??$u['username']??'')),'yar')&&str_contains(strtolower((string)($u['full_name']??$u['username']??'')),'azam'))$requested[]=(int)$u['id'];
          if(count($requested)!==1)throw new RuntimeException('Requested operator is ambiguous');
          $review=[];foreach($rows('tt30prod') as $row){
              if(($row['date']??'')!=='2026-11-02'||strtolower(trim($row['shift']??''))!=='day'||($row['entity']??'TTI')!=='TTI'||strtolower(trim($row['millName']??$row['mill']??'TTI Rice Mills'))!=='tti rice mills')continue;
              $id=(string)$row['id'];$issues=array_values(array_filter($rows('tt36bagissues'),static fn($i)=>(string)($i['productionId']??'')===$id));$audit=array_values(array_filter($rows('tt30prodaudit'),static fn($a)=>(string)($a['productionId']??'')===$id));
              $review[]=['controlDigest'=>hash('sha256',$id),'savedActorMatchesRequestedOperator'=>count($issues)===1&&(int)($issues[0]['userId']??0)===$requested[0],'amendmentCount'=>count($audit),'hasStableSaveIdentity'=>!empty($row['clientSaveRequestId'])];
          }
          echo json_encode(['review'=>$review,'businessFilesWritten'=>0],JSON_THROW_ON_ERROR).PHP_EOL;
          PHP
