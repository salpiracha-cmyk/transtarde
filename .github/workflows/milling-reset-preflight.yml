name: Milling Reset Preflight

on:
  push:
    branches: [ops-milling-reset-20260917]
    paths: ['.github/workflows/milling-reset-preflight.yml']

permissions:
  contents: read

concurrency:
  group: milling-reset-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: live-qa
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
    steps:
      - name: Configure verified SSH connection
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Read-only Milling and ASAS preflight
        run: |
          set -euo pipefail
          case "$HOSTINGER_DEPLOY_PATH" in
            /home/*/domains/app.transtradeinternational.com/public_html) ;;
            *) echo "Unexpected production path"; exit 1 ;;
          esac
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" php -- "$HOSTINGER_DEPLOY_PATH" <<'PHP'
          <?php
          declare(strict_types=1);
          $target=(string)($argv[1]??'');
          require $target.'/auth_store.php';
          $path=TT_DATA_DIR.'/operations.json';
          $store=is_file($path)?json_decode((string)file_get_contents($path),true):null;
          if(!is_array($store)) throw new RuntimeException('Operational store unavailable.');
          $exportRaw=(string)($store['values']['transtrade_export_v3_operational']??'');
          $root=$exportRaw!==''?json_decode($exportRaw,true):null;
          if(!is_array($root)) throw new RuntimeException('Export operational store unavailable.');
          $isAsas=static function(mixed $row):bool{
            $text=json_encode($row,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)?:'';
            return stripos($text,'ASAS')!==false;
          };
          $deleted=[];
          foreach((array)($root['deletedShipments']??[]) as $row){
            if(!is_array($row)||!empty($row['restoredAt']))continue;
            foreach(['id','processId','contractRef'] as $f){$v=(string)($row[$f]??'');if($v!=='')$deleted[$v]=true;}
          }
          $contracts=array_values(array_filter((array)($root['contracts']??[]),static fn($r)=>is_array($r)&&$isAsas($r)));
          $shipments=[];
          foreach((array)($root['shipments']??[]) as $row){
            if(!is_array($row)||!$isAsas($row))continue;
            $row['_deleted']=isset($deleted[(string)($row['id']??'')])||isset($deleted[(string)($row['contractRef']??'')]);
            $shipments[]=$row;
          }
          $summarize=static fn(array $r):array=>[
            'id'=>(string)($r['id']??''),'contractRef'=>(string)($r['contractRef']??$r['ref']??''),
            'lotId'=>(string)($r['lotId']??$r['lotRef']??''),'status'=>(string)($r['status']??''),
            'containers'=>(int)($r['containers']??0),'brand'=>(string)($r['brand']??''),
            'deleted'=>(bool)($r['_deleted']??false)
          ];
          $sync=[];
          foreach(['productionInstructions','exportLoading'] as $kind){
            $sync[$kind]=array_values(array_map(static fn(array $r):array=>[
              'contractRef'=>(string)($r['contractRef']??''),'lotId'=>(string)($r['lotId']??''),
              'shipmentId'=>(string)($r['shipmentId']??''),'sentAt'=>(string)($r['sentAt']??''),
              'createdAt'=>(string)($r['createdAt']??''),'updatedAt'=>(string)($r['updatedAt']??''),
              'loadingProgrammeNo'=>(string)($r['loadingProgrammeNo']??$r['programmeNo']??''),
              'product'=>(string)($r['product']??''),'quality'=>$r['quality']??'',
              'packings'=>$r['packings']??[],'plan'=>$r['plan']??[],'production'=>$r['production']??[]
            ],array_filter((array)($root['millSync'][$kind]??[]),static fn($r)=>is_array($r)&&$isAsas($r))));
          }
          $millCounts=[];
          foreach((array)($store['values']??[]) as $key=>$raw){
            if(!preg_match('/^tt[0-9]{2}[a-z0-9_]{2,60}$/',(string)$key))continue;
            $decoded=json_decode((string)$raw,true);
            $millCounts[(string)$key]=is_array($decoded)?count($decoded):null;
          }
          ksort($millCounts);
          echo json_encode(['ok'=>true,'revision'=>(int)($store['revision']??0),'contracts'=>array_map($summarize,$contracts),'shipments'=>array_map($summarize,$shipments),'millSync'=>$sync,'millCounts'=>$millCounts],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT).PHP_EOL;
          PHP
