name: Remove audited superseded branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-audited-superseded-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete exact audited obsolete tips
        env:
          AUDITED_TIPS: |
            codex/sales-contract-entry-corrections	7e6c5a41ef8d45227bedf279b6f407584b914996
            customer-master-sync	c03278b370b237baef19588ab961530cbd3fd742
            exports-clean-v1	1c39f678cc278a074bf4e099137374ba8b38b8ec
            exports-complete-lot-gate-20260910	97057037cf5e6d0012e6708b85d3ce94d0d42065
            exports-fob-removable-options-20260912	c42e8e5293f5c29a8f518ffc3a7e683321702a3d
            exports-interface-dataflow-20260909	f343005ac568f7bb057c86ad3041f58470c06ee0
            exports-output-repair-20260914	3cf57190e7503ec0c2e354639db21f42d0aef914
            fix-live-po-output-20260912	3823a0bb7f0698a1f7e1d77ed5617674da082d55
            fix/accounts-jv-reopen-null-20260912	2bfd51f77e1082c1380b84cfbff24a6da56fd1f1
            fix/accounts-jv-reopen-null-current-20260912	438eb73e950f1842e7d0a727b111f8a752444132
            fix/exports-sales-contract-preview-only-20260913	84cbb5033a95014034e53db8a8600105324b4cd8
            fix/live-save-badge-qa-20260913	574536e1e6deb8639b3488e64316fae93a18964a
            fix/sales-contract-split-preview-20260913	a9c7227bf6729cb8c5381e885e02cfc3d9d96adf
            hold/transtrade-theme-next-output-20260913	42c36b9b93b9ce6704779f1f5c8031fb86a9e4b7
            pending/master-data-topbar-m	f8d1ac3c9ce0c9bc26bd1fc26c7f96a7983405e2
            pending/offline-save-recovery-m	7e6c5a41ef8d45227bedf279b6f407584b914996
            pending/offline-save-recovery-v2	b777c224261fe0c88f6252f2e5798bb399f4ee27
            qa/live-acceptance-followup	1f10a8d97e67388497d6c241be60330407d34d2a
            release/pending-safeguards-20260912	74cd6abeadd5849de2ce09f33ef02708c5a78994
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted=0
          preserved=0
          while IFS=$'\t' read -r branch expected_sha; do
            [ -n "$branch" ] || continue
            [ "$branch" != "main" ] || { echo "::error::Safety check rejected main"; exit 1; }

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Already absent: $branch"
              continue
            fi

            current_sha=$(git rev-parse "refs/remotes/origin/$branch")
            if [ "$current_sha" = "$expected_sha" ]; then
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "::warning::Preserved changed branch: $branch"
              preserved=$((preserved + 1))
            fi
          done <<< "$AUDITED_TIPS"

          echo "Deleted $deleted audited superseded branches."
          echo "Preserved $preserved changed branches."

      - name: Remove this temporary maintenance workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-audited-superseded-branches.yml
          git commit -m "Remove completed superseded-branch cleanup workflow [cleanup-only]"
          git push origin HEAD:main
