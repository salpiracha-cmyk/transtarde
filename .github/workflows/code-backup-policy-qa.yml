name: Code backup retention boundaries
on:
  pull_request:
    paths: ['.github/workflows/code-backup-policy-qa.yml', '.github/workflows/deploy-production.yml', '.github/scripts/code_backup_retirement*']
  push:
    branches: [main]
    paths: ['.github/workflows/code-backup-policy-qa.yml', '.github/workflows/deploy-production.yml', '.github/scripts/code_backup_retirement*']
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n .github/scripts/code_backup_retirement.sh
          python3 .github/scripts/code_backup_retirement_test.py
