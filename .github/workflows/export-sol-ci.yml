name: Export SOL CI

on:
  push:
    branches: [exports-clean-v1]
  pull_request:
    branches: [main]
    paths:
      - 'exports/**'
      - 'tests/export_sol_ci.js'
      - 'tests/export_browser_smoke.js'
      - 'tests/export_harness.html'
      - '.github/workflows/export-sol-ci.yml'

jobs:
  export-sol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Export SOL business-rule checks
        run: node tests/export_sol_ci.js
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run Export SOL Chromium smoke checks
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/export-sol-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/export_browser_smoke.js
