name: Review remaining Daily reconciliation (read only)
on:
  push:
    branches: [review/daily-reconciliation-20261018]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing verified production connection
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Project private source snapshots without writing application data
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          ACCOUNT: ${{ secrets.HOSTINGER_USER }}
          TARGET: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          case "$TARGET" in /home/*/domains/app.transtradeinternational.com/public_html) ;; *) exit 1;; esac
          ssh -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$PORT" "$ACCOUNT@$HOST" bash -s -- "$TARGET" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          php <<'PHP'
          <?php
          $stage='setup';set_exception_handler(static function(Throwable $e)use(&$stage):void{echo json_encode(['failedStage'=>$stage,'errorClass'=>get_class($e),'message'=>$e->getMessage()])."\n";exit(1);});
          $live=getcwd();$private=dirname($live).'/transtrade_private';$review=dirname($live).'/.daily-source-review-'.bin2hex(random_bytes(8));$handles=[];
          if(!mkdir($review,0700)||!mkdir($review.'/api',0700)||!mkdir($review.'/accounts',0700))throw new RuntimeException('Private source review unavailable.');
          try{
          foreach(['inventory_reconciliation.php','product_stage.php'] as $name)if(!copy($live.'/'.$name,$review.'/'.$name))throw new RuntimeException('Pure source copy failed.');
          foreach(['mill_recovery_core.php','rice_ledger_core.php','arrival_withdrawal_core.php','accounts_subaccounts_core.php','accounts_reference.php','assets_registry_core.php','accounts_ledger_visibility.php'] as $name)if(!copy($live.'/api/'.$name,$review.'/api/'.$name))throw new RuntimeException('Pure dependency copy failed.');
          foreach(['accounting_master_v1.json','settlement_policy_v1.json','export_realization_policy_v1.json'] as $name)if(is_file($live.'/accounts/'.$name)&&!copy($live.'/accounts/'.$name,$review.'/accounts/'.$name))throw new RuntimeException('Chart copy failed.');
          if(file_put_contents($review.'/api/group_daily_core.php',base64_decode('',true))===false)throw new RuntimeException('Draft source copy failed.');
          if(file_put_contents($review.'/api/group_management_core.php',base64_decode('',true))===false)throw new RuntimeException('Draft source copy failed.');
          require $review.'/api/group_daily_core.php';
          $stage='locked-original-file-read';$read=static function(string $path)use(&$handles):array{$h=fopen($path,'rb');if(!$h||!flock($h,LOCK_SH))throw new RuntimeException('Original source unavailable.');$handles[]=$h;return json_decode(stream_get_contents($h),true,512,JSON_THROW_ON_ERROR);};
          $books=$read($private.'/accounts.json');$ops=$read($private.'/operations.json');$before=[hash_file('sha256',$private.'/accounts.json'),hash_file('sha256',$private.'/operations.json')];$ops['sourceBackend']='original-file-snapshot';
          $stage='daily-projection';$date=(new DateTimeImmutable('now',new DateTimeZone('Asia/Karachi')))->format('Y-m-d');$source=gd_sources($books,$ops,$date);$holds=[];foreach($source['holds'] as $hold)$holds[$hold['message']]=($holds[$hold['message']]??0)+1;
          $purchase=['count'=>count($source['purchaseOrders']),'active'=>0,'unknownQuantity'=>0,'unknownReceipts'=>0,'rice'=>0,'corn'=>0];foreach($source['purchaseOrders'] as $row){if(!$row['closed'])$purchase['active']++;if(!$row['quantityKnown'])$purchase['unknownQuantity']++;if(!$row['receivedKnown'])$purchase['unknownReceipts']++;if($row['commodity']==='RICE')$purchase['rice']++;if($row['commodity']==='CORN')$purchase['corn']++;}
          $sales=['count'=>count($source['salesContracts']),'active'=>0,'unknownOutstanding'=>0,'unsigned'=>0,'rice'=>0,'corn'=>0,'unclassifiedCommodity'=>0];foreach($source['salesContracts'] as $row){if(!$row['closed'])$sales['active']++;if($row['outstandingMT']===null)$sales['unknownOutstanding']++;if(!$row['signed'])$sales['unsigned']++;if($row['commodity']==='RICE')$sales['rice']++;elseif($row['commodity']==='CORN')$sales['corn']++;else $sales['unclassifiedCommodity']++;}
          $financial=['rowCount'=>count($source['financials']['rows']),'warnings'=>$source['financials']['warnings'],'companies'=>[]];foreach($source['financials']['rows'] as $row)$financial['companies'][$row['entity']]=($financial['companies'][$row['entity']]??0)+1;$intercompany=[];foreach($source['financials']['rows'] as $row)if(in_array($row['account'],['1240','2500'],true))$intercompany[]=['entity'=>$row['entity'],'account'=>$row['account'],'currency'=>$row['currency'],'amount'=>$row['amount'],'postCount'=>count($row['postIds'])];$financial['intercompanyBookBalances']=$intercompany;$financial['pendingIntercompanyReviews']=count(array_filter((array)($books['exportCandidates']??[]),static fn($c)=>is_array($c)&&($c['entity']??'')==='TG'&&($c['candidateType']??'')==='TG_INTERCOMPANY_PAYABLE'&&empty($c['journalId'])));$financial['intercompanyPostings']=[];foreach((array)($books['journals']??[]) as $id=>$j){if(!is_array($j)||!in_array($j['status']??'',['Posted','Posted / Bill Pending'],true)||!mr_valid_date((string)($j['date']??''))||$j['date']>$date)continue;foreach((array)($j['lines']??[]) as $l)if(in_array((string)($l['account']??''),['1240','2500'],true))$financial['intercompanyPostings'][]=['postId'=>(string)($j['id']??$id),'date'=>$j['date'],'entity'=>$j['entity'],'sourceType'=>$j['sourceType']??'','account'=>$l['account'],'bookNet'=>round((float)($l['debit']??0)-(float)($l['credit']??0),2),'nativeCurrency'=>$l['currency']??'','nativeNet'=>isset($l['nativeDebit'],$l['nativeCredit'])?round((float)$l['nativeDebit']-(float)$l['nativeCredit'],2):null];}
          echo json_encode(['readOnly'=>true,'basis'=>'Original file snapshot only; CLI database configuration is not web-backend clearance.','date'=>$date,'accountsRevision'=>$source['accountsRevision'],'operationsRevision'=>$source['operationsRevision'],'purchase'=>$purchase,'sales'=>$sales,'stockProducts'=>count($source['stocks']),'holdReasons'=>$holds,'financial'=>$financial,'sourceBytesUnchanged'=>$before===[hash_file('sha256',$private.'/accounts.json'),hash_file('sha256',$private.'/operations.json')]],JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n";
          }finally{foreach($handles as $h){flock($h,LOCK_UN);fclose($h);}foreach(['api','accounts'] as $folder){foreach(glob($review.'/'.$folder.'/*')?:[] as $file)if(is_file($file))unlink($file);if(is_dir($review.'/'.$folder))rmdir($review.'/'.$folder);}foreach(glob($review.'/*')?:[] as $file)if(is_file($file))unlink($file);if(is_dir($review))rmdir($review);}
          echo "PRIVATE_DAILY_REVIEW_REMOVED=true\n";
          PHP
          REMOTE
