name: Apply verified Export repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/export-runtime-repair
      - name: Apply verified local patch
        shell: bash
        run: |
          base64 -d <<'PATCH64' | gzip -d > /tmp/export-runtime-repair.patch
          
          PATCH64
          git apply --index /tmp/export-runtime-repair.patch
          git rm .github/workflows/codex-export-repair-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden runtime and repair Export document flow"
          git push origin HEAD:codex/export-runtime-repair
