name: Manual Hostinger Live QA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/live-hostinger-qa.yml']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CREATE TWO QA CONTAINERS to authorize uniquely labelled live dummy data'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transtrade-live-qa
  cancel-in-progress: true

jobs:
  live-qa:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: live-qa
    steps:
      - name: Enforce manual live-data confirmation
        env:
          LIVE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$LIVE_CONFIRMATION" != "CREATE TWO QA CONTAINERS" ]; then
            echo "Live dummy-data authorization phrase does not match."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify QA secrets are configured
        env:
          QA_USERNAME: ${{ secrets.TRANSTRADE_QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.TRANSTRADE_QA_PASSWORD }}
        run: |
          test -n "$QA_USERNAME" || { echo "Missing TRANSTRADE_QA_USERNAME secret"; exit 1; }
          test -n "$QA_PASSWORD" || { echo "Missing TRANSTRADE_QA_PASSWORD secret"; exit 1; }

      - name: Install isolated browser test runtime
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Create harmless QA bag-marking fixture
        run: |
          mkdir -p tests/live
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAHgAAABaAQMAAABJzgCsAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGUExURQsvVf///3BcKFsAAAABYktHRAH/Ai3eAAAAB3RJTUUH6gkPDB42PJmzQQAAABRJREFUOMtjYBgFo2AUjIJRMBgBAAWgAAErlUh4AAAAAElFTkSuQmCC' | base64 --decode > tests/live/qa-bag-mark.png

      - name: Run live Exports to Milling round trip
        env:
          TRANSTRADE_BASE_URL: https://app.transtradeinternational.com
          TRANSTRADE_QA_USERNAME: ${{ secrets.TRANSTRADE_QA_USERNAME }}
          TRANSTRADE_QA_PASSWORD: ${{ secrets.TRANSTRADE_QA_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/live/hostinger-qa.spec.js --grep-invert "live deletion survives sign-out and sign-in" --reporter=line,html

      - name: Upload screenshots, video, trace and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-live-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  cleanup:
    name: always-clean-live-qa-data
    if: ${{ always() }}
    needs: live-qa
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: live-qa
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify cleanup script
        run: php -l scripts/cleanup_qa_data.php

      - name: Configure verified SSH connection
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Remove only marked QA data and audit business records
        run: |
          set -euo pipefail
          case "$HOSTINGER_DEPLOY_PATH" in
            /home/*/domains/app.transtradeinternational.com/public_html) ;;
            *) echo "Unexpected production path"; exit 1 ;;
          esac
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            bash -s -- "$HOSTINGER_DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          target=$1
          cleanup_result=$(php "$target/scripts/cleanup_qa_data.php" --apply)
          echo "QA_CLEANUP=$cleanup_result"
          recovery_audit=$(php "$target/scripts/recover_export_records.php")
          echo "POST_CLEANUP_RECOVERY_AUDIT=$recovery_audit"
          php -r '$result=json_decode($argv[1],true); if(!is_array($result)||($result["ok"]??false)!==true||(int)($result["contracts"]??0)>0){fwrite(STDERR,"Business-record recovery audit failed after QA cleanup.\n");exit(1);}' "$recovery_audit"
          REMOTE
