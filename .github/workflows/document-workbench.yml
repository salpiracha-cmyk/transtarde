name: Document source workbench
on:
  push:
    branches: ['workbench/exports-documents-20260919']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trace source dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('exports/app.js').read_text().splitlines()
          names=r'bagMarkingCell|bagMark|businessBanks|fiReference|ttCustomsBankRow|ttDirectCustomsPaymentCode|paymentText|contractBank|specimenPartyBox|salesOther|salesTerm|blankDocuments'
          for i,line in enumerate(lines,1):
            if re.search(r'^(?:(?:async )?function|const)\s+(?:'+names+r')\b',line) and '__legacy' not in line[:100]:
              print(f'JS {i}: {line}')
          for i,line in enumerate(Path('exports/app.css').read_text().splitlines(),1):
            if re.search(r'commercialInvoice|commercialRemittance|bankCovering|coverDispatch|printModeWithout|conditionalOutputSignature|docAutoSign|specimenGoods|specimenParty|specimenRoute|\.docPage[ {.]',line):print(f'CSS {i}: {line}')
          for p in Path('exports/assets').glob('*'):print('ASSET',p,p.stat().st_size)
          PY
