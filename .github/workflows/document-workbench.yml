name: Document source workbench
on:
  push:
    branches: ['workbench/exports-documents-20260919']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Locate document dependency definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for i,line in enumerate(Path('exports/app.js').read_text().splitlines(),1):
            if re.search(r'bagArtwork|markingImage|brandImage|commercialMark|renderCommercial|businessBanks|effectiveTerms|contractPayment|processFor|contractTotal|contractBank|ttCustomsBankRow|ttDirectCustomsPaymentCode|customsOutputPayment',line) and '__legacy' not in line[:100]:print(f'{i}: {line[:1300]}')
          for i,line in enumerate(Path('exports/app.css').read_text().splitlines(),1):
            if re.search(r'commercialSettlement|commercialReceivable|docBrand|amountWords|approvedInvoiceReference|commercialRouteGrid',line):print(f'CSS {i}: {line}')
          PY
