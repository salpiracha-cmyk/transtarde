name: Document source workbench
on:
  push:
    branches: ['workbench/exports-documents-20260919']
permissions:
  contents: write
jobs:
  prepare-wording:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c067578490d521d0e44fa6f6a171f9e33e4bf029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Edit the existing shared covering sentence and regression expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          app=Path('exports/app.js')
          assert subprocess.check_output(['git','hash-object',str(app)],text=True).strip()=='c566a111672bc88c0d41609586fd74ee594f1487'
          text=app.read_text()
          old=" const close=`KINDLY RECORD THE ENCLOSED DOCUMENTS${referenceNames?` AND SETTLE/UTILIZE THE APPLICABLE ${referenceNames}`:''} ACCORDINGLY.`;"
          new=old.replace('ACCORDINGLY.','UPON RECEIPT OF PAYMENT.')
          assert text.count(old)==1, 'Shared closing sentence changed; review required'
          app.write_text(text.replace(old,new))
          test=Path('tests/exports-v3/document_revision_20260919_browser_qa.js')
          text=test.read_text()
          assert 'SETTLE/UTILIZE THE APPLICABLE F.I AND GD ACCORDINGLY.' in text
          text=text.replace('ACCORDINGLY','UPON RECEIPT OF PAYMENT')
          needle="  if(code==='ADV_CAD')assert.ok(r.text.includes('USD 15,120.00'));"
          assert text.count(needle)==1
          extra="  assert.ok(r.text.includes('KINDLY RECORD THE ENCLOSED DOCUMENTS AND SETTLE/UTILIZE THE APPLICABLE F.I AND GD UPON RECEIPT OF PAYMENT.'));\n"
          test.write_text(text.replace(needle,extra+needle))
          print('Updated only the shared closing sentence and Direct/TG wording assertions.')
          PY
      - name: Check syntax and existing release controls
        run: |
          set -euo pipefail
          node --check exports/app.js
          node --check tests/exports-v3/document_revision_20260919_browser_qa.js
          git diff --check
          node tests/exports-v3/export_release_test.js
          node tests/exports-v3/document_rules_20260917_audit.js
          git diff --stat
          git diff -- exports/app.js tests/exports-v3/document_revision_20260919_browser_qa.js
      - name: Publish only the source and test changes for the existing QA gates
        run: |
          set -euo pipefail
          git checkout -b release/covering-payment-wording-20260919
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/app.js tests/exports-v3/document_revision_20260919_browser_qa.js
          git commit -m 'Use upon-receipt-of-payment closing on all bank covering letters'
          git push origin HEAD:refs/heads/release/covering-payment-wording-20260919
          echo "REVIEW_COMMIT=$(git rev-parse HEAD)"
