name: Document source workbench
on:
  push:
    branches: ['workbench/exports-documents-20260919']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53ef4cab9984ad9d9560294af0d202cab3219f8b
      - name: Archive the exact baseline source, without runtime data
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/document-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: document-source-baseline
          path: ${{ runner.temp }}/document-source.tar
          retention-days: 3
