name: Document source workbench
on:
  push:
    branches: ['workbench/exports-documents-20260919']
permissions:
  contents: write
jobs:
  prepare-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de749b9aa602a29263f68560e7d9e0488f033552
      - name: Prepare and hash-check letterhead clearance and regression assertion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          updates=[('exports/app.css','36f69b1c802194ab5ddecf14955d325ab6ad9d0dba7b0de7b9209f5ffce2d2cc','.bankCoveringPage{padding:38mm','.bankCoveringPage{padding:57mm','3250084077cb31b058a870be2b10f1173ee02c2f009fcd3a54791f8311d7920f')]
          needle='  const report=await page.evaluate('
          addition="  assert.ok(await page.evaluate(()=>{const cover=document.querySelector('#printRoot .bankCoveringPage');return !cover||parseFloat(getComputedStyle(cover).paddingTop)>=57*96/25.4-1}),name+' must reserve the physical-letterhead area');\n"
          updates.append(('tests/exports-v3/document_revision_20260919_browser_qa.js','ba8ac2ecea731bc5c0ea92ea0bde24f8c4d3d5589373f24a1896a14ebeda0220',needle,addition+needle,'62ba176a9979bef1910db5bd5c5aa8befe67c37914cc75456a9fc59b25fafe37'))
          result={}
          for name,before,old,new,after in updates:
            raw=pathlib.Path(name).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==before
            text=raw.decode();assert text.count(old)==1
            raw=text.replace(old,new).encode();assert hashlib.sha256(raw).hexdigest()==after
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
            assert blob['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            result[name]=blob['sha']
          print('VERIFIED_BLOBS='+json.dumps(result,sort_keys=True))
          PY
