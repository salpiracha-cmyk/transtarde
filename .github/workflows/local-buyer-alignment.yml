name: Owner-authorized local buyer alignment

on:
  pull_request:
    paths: ['.github/scripts/align_local_buyer*.php', '.github/workflows/local-buyer-alignment.yml']
  push:
    branches: [main]
    paths: ['.github/scripts/align_local_buyer*.php', '.github/workflows/local-buyer-alignment.yml']

permissions:
  contents: read

concurrency:
  group: local-buyer-alignment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the scoped correction on disposable books
        run: |
          php -l .github/scripts/align_local_buyer.php
          php .github/scripts/align_local_buyer_test.php
  correct:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Mill source and align the existing Accounts postings
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          case "$HOSTINGER_DEPLOY_PATH" in /home/*/domains/app.transtradeinternational.com/public_html) ;; *) exit 1 ;; esac
          install -m 700 -d "$RUNNER_TEMP/ssh"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          target=$(printf '%q' "$HOSTINGER_DEPLOY_PATH")
          ssh -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" "TT_MLA_ROOT=$target php" < .github/scripts/align_local_buyer.php
