name: Read-only customer ledger diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/customer-ledger-diagnostics.yml']

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace customer ledger references without amounts or private documents
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" bash -s -- "$HOSTINGER_DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          target=$1
          case "$target" in /home/*/domains/app.transtradeinternational.com/public_html) ;; *) exit 1 ;; esac
          TT_DIAGNOSTIC_ROOT="$target" php <<'PHP'
          <?php
          $root=getenv('TT_DIAGNOSTIC_ROOT');require $root.'/auth_store.php';require_once $root.'/api/accounts_shipment_source.php';require_once $root.'/api/customer_receivables_core.php';require_once $root.'/api/carry_forward_core.php';
          $handle=fopen(TT_DATA_DIR.'/accounts.json','rb');if(!$handle||!flock($handle,LOCK_SH))throw new RuntimeException('Accounts source unavailable.');try{$rawBooks=(string)stream_get_contents($handle);$s=json_decode($rawBooks,true,512,JSON_THROW_ON_ERROR);if(!is_array($s)||($s!==[]&&array_is_list($s)))throw new RuntimeException('Invalid Accounts source.');}finally{flock($handle,LOCK_UN);fclose($handle);}$r=tt_accounts_exports_root();$masters=tt_list_masters();$key=fn($v)=>strtoupper(preg_replace('/[^a-z0-9]/i','',(string)$v));
          $watch=['Ali Sulaiman'=>'ALISUL','Azad Labour'=>'AZADLAB','JJ Broker / Shayan'=>'JJBRO','Jaideep Commodities'=>'JAIDEEP'];$summary=[];
          $customers=[];foreach((array)($r['customers']??[]) as $c)$customers[(string)($c['id']??'')]=$c['name']??'';
          $contracts=[];foreach((array)($r['contracts']??[]) as $c)$contracts[(string)($c['ref']??'')]=$c;
          foreach($watch as $label=>$needle){$names=[];$ids=[];foreach(['business_parties','export_customers'] as $type)foreach((array)($masters[$type]??[]) as $m)if(str_contains($key($m['values'][0]??''),$needle)){$names[]=$key($m['values'][0]);$ids[]=(string)$m['id'];}
          $matches=function($v)use($needle,$key,$names,$ids){return in_array((string)$v,$ids,true)||in_array($key($v),$names,true)||str_contains($key($v),$needle);};
          $o=['masterRecords'=>count($ids),'postedPartyLines'=>0,'lineCandidateLinkedToCustomer'=>0,'linePartyMissingButCandidateMatches'=>0,'exportCandidates'=>0,'recognizedCandidates'=>0,'nativeRegisteredCandidates'=>0,'exportShipments'=>0,'savedInvoices'=>0,'receiptAllocations'=>0,'companies'=>[]];$candidateIds=[];
          foreach((array)($s['exportCandidates']??[]) as $id=>$c)if($matches($c['counterparty']??'')||$matches($c['meta']['customer']??'')){$candidateIds[]=$id;$o['exportCandidates']++;if(!empty($c['journalId']))$o['recognizedCandidates']++;if(!empty($c['pendingValuation']))$o['nativeRegisteredCandidates']++;$o['companies'][$c['entity']??'UNKNOWN']=true;}
          foreach((array)($r['shipments']??[]) as $x){$c=$contracts[$x['contractRef']??'']??[];if($matches($x['buyer']??'')||$matches($c['customer']??'')||$matches($customers[$c['customerId']??'']??'')){$o['exportShipments']++;if(!empty($x['commercial']['saved']))$o['savedInvoices']++;}}
          foreach((array)($s['journals']??[]) as $j)if(($j['status']??'')==='Posted')foreach((array)($j['lines']??[]) as $l){if(!in_array($l['account']??'',['1210','1220','1230','1240','1250','2110','2120','2130','2140','2160','2190','2500','2510','3100','3200']))continue;$party=$l['supplier']??$l['broker']??$l['customer']??$l['counterparty']??$l['party']??$l['subledger']??'';$cid=$l['candidateId']??$l['sourceCandidateId']??$j['meta']['candidateId']??'';if($matches($party))$o['postedPartyLines']++;if(in_array($cid,$candidateIds,true)){$o['lineCandidateLinkedToCustomer']++;if(!$matches($party))$o['linePartyMissingButCandidateMatches']++;}}
          foreach((array)($s['exportReceipts']??[]) as $x)if(($x['status']??'')==='Accounts Approved / Posted')foreach((array)($x['allocations']??[]) as $a)if($matches($a['customer']??'')||in_array($a['targetId']??'',$candidateIds,true))$o['receiptAllocations']++;$o['companies']=array_keys($o['companies']);$summary[$label]=$o;}
          $all=['customerMasters'=>count($masters['export_customers']??[]),'customersWithPostedCandidates'=>0,'customersWithUnpostedInvoices'=>0,'customersWithNativeRegistration'=>0,'candidateLinkedPartyLinesMissingNames'=>0];$sets=[[],[],[]];foreach((array)($s['exportCandidates']??[]) as $c)if(($c['candidateType']??'')==='CUSTOMER_EXPORT_SALE'){$n=$key($c['meta']['customer']??$c['counterparty']??'');$i=!empty($c['journalId'])?0:(!empty($c['pendingValuation'])?2:1);$sets[$i][$n]=true;}foreach($sets as $i=>$v)$all[['customersWithPostedCandidates','customersWithUnpostedInvoices','customersWithNativeRegistration'][$i]]=count($v);
          foreach((array)($s['journals']??[]) as $j)if(($j['status']??'')==='Posted')foreach((array)($j['lines']??[]) as $l)if(in_array($l['account']??'',['1210','1220','1240','2160','2510'])){$cid=$l['candidateId']??$l['sourceCandidateId']??$j['meta']['candidateId']??'';if($cid!==''&&isset($s['exportCandidates'][$cid])&&empty($l['counterparty'])&&empty($l['customer'])&&empty($l['party'])&&empty($l['subledger']))$all['candidateLinkedPartyLinesMissingNames']++;}
          
          $projection=tt_customer_receivables($s,$r,['TTI','BRM','TG'],date('Y-m-d'));$aliIssued=0;$aliDraft=0;$customerKeys=[];foreach($projection['rows'] as $x){$customerKeys[$key($x['label'])]=true;if(str_contains($key($x['label']),'ALISUL'))$aliIssued++;}foreach($projection['drafts'] as $x)if(str_contains($key($x['label']),'ALISUL'))$aliDraft++;$verified=['aliIssuedInvoiceRows'=>$aliIssued,'aliDraftInvoiceRows'=>$aliDraft,'allIssuedInvoiceRows'=>count($projection['rows']),'customersWithInvoiceRows'=>count($customerKeys),'carryForwardInvoiceRows'=>count(array_filter($projection['rows'],fn($x)=>!empty($x['carryForward'])))];
          $carrySummary=['total'=>0,'statuses'=>[],'entities'=>[],'tgPacks'=>0,'readyPositivePakistan'=>0,'readyMissingCandidate'=>0];foreach((array)($s['carryForwardShipments']??[]) as $x){$carrySummary['total']++;$st=$x['status']??'UNKNOWN';$e=$x['entity']??'UNKNOWN';$carrySummary['statuses'][$st]=($carrySummary['statuses'][$st]??0)+1;$carrySummary['entities'][$e]=($carrySummary['entities'][$e]??0)+1;if(!empty($x['tgPack'])){$carrySummary['tgPacks']++;if($st==='Ready for Accounts'&&(float)($x['pakistanBalance']['outstanding']??0)>.005){$carrySummary['readyPositivePakistan']++;$cid=$x['pakistanCandidateId']??$x['id'].'|PAKISTAN';if(!isset($s['exportCandidates'][$cid]))$carrySummary['readyMissingCandidate']++;}}}
          $selector=['savedTtiCarryInvoices'=>count(cf_saved_tg_invoice_sources($s,'TTI')),'savedBrmCarryInvoices'=>count(cf_saved_tg_invoice_sources($s,'BRM')),'releaseFiles'=>[]];foreach(['api/carry_forward_core.php','api/export_receipts.php','accounts/carry-forward-ui.js','accounts/export-receipts-ui.js'] as $file)$selector['releaseFiles'][$file]=hash_file('sha256',$root.'/'.$file);
          echo json_encode(['carryForwardSelector'=>$selector,'carryForwardRegister'=>$carrySummary,'newLedgerProjection'=>$verified,'readOnly'=>true,'watched'=>$summary,'allCustomers'=>$all],JSON_PRETTY_PRINT)."\n";
          require_once $root.'/api/commodity_quantity_core.php';
          $today=(new DateTimeImmutable('now',new DateTimeZone('Asia/Karachi')))->format('Y-m-d');$year=(int)substr($today,0,4)-((int)substr($today,5,2)<7?1:0);$from=$year.'-07-01';$sourceBefore=hash('sha256',$rawBooks);$ops=gd_read_operations(TT_DATA_DIR.'/operations.json');$review=[];$unique=[];
          foreach(['TTI','BRM','TG'] as $entity){$q=cq_report($s,$ops,$entity,$from,$today);$z=gm_zakat_payments($s,$from,$today,$entity);$posts=[];
          foreach((array)($s['journals']??[]) as $id=>$j){if(!is_array($j)||($j['entity']??'')!==$entity)continue;$jid=(string)($j['id']??$id);$watched=false;foreach($z['warnings'] as $warning)if(preg_match('/'.preg_quote($jid,'/').'(?![A-Za-z0-9-])/',$warning))$watched=true;if(!$watched)continue;$dates=[];$accounts=[];$dr=0.;$cr=0.;foreach((array)($j['lines']??[]) as $l){$accounts[]=(string)($l['account']??'');if(array_key_exists('paymentDate',$l))$dates[]=$l['paymentDate'];$dr+=(float)($l['debit']??0);$cr+=(float)($l['credit']??0);}$posts[]=['postId'=>$jid,'sourceType'=>$j['sourceType']??'','originalSourceType'=>$j['meta']['originalSourceType']??'','date'=>$j['date']??'','paymentDates'=>array_values(array_unique($dates)),'accounts'=>array_values(array_unique($accounts)),'balanced'=>abs($dr-$cr)<.005];}
          foreach($q['sourceHolds'] as $hold){$key=$hold['sourceId'].'|'.$hold['message'];$unique[$key]??=['sourceId'=>$hold['sourceId'],'message'=>$hold['message'],'companies'=>[]];$unique[$key]['companies'][]=$entity;}
          $review[$entity]=['quantityRowCount'=>count($q['rows']),'quantityHolds'=>$q['sourceHolds'],'zakatWarnings'=>$z['warnings'],'zakatOriginalSourceReview'=>$posts];}
          echo 'ACCOUNTING_SOURCE_REVIEW '.json_encode(['from'=>$from,'through'=>$today,'readOnly'=>true,'accountsSnapshotStable'=>$sourceBefore===hash_file('sha256',TT_DATA_DIR.'/accounts.json'),'operationsBackend'=>$ops['sourceBackend'],'reviews'=>$review,'uniqueQuantityHolds'=>array_values($unique)],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          $parent=[];foreach(gd_rows($ops['values'],'tt35exmill') as $row)$parent[(string)($row['id']??'')][]=array_intersect_key($row,array_flip(['id','entity','_ttPurchaseSodaId','_ttBridgeId']));$native=gd_rows($ops['values'],'tt35exload');$links=[];
          foreach((array)($s['purchaseSodaLiftings']??[]) as $id=>$lifting){if(($lifting['entity']??'')!=='TTI'||($lifting['sourceSodaId']??'')!=='PS-RICE-26003'||!empty($lifting['reversed']))continue;$matches=[];foreach($native as $load){if(gd_container_identity($load['container']??'')!==gd_container_identity($lifting['container']??''))continue;$matches[]=['entity'=>$load['entity']??'','sourceSodaId'=>$load['sourceSodaId']??'','sodaId'=>$load['sodaId']??'','parents'=>$parent[(string)($load['sodaId']??'')]??[],'physicalDate'=>gd_date($load['date']??''),'financialDate'=>gd_date($lifting['date']??''),'dateMatches'=>gd_date($load['date']??'')===gd_date($lifting['date']??''),'weightMatches'=>abs((float)($load['kg']??0)-(float)($lifting['kg']??0))<.001];}$links[]=['sourceId'=>(string)$id,'matches'=>$matches];}
          $comparison=[];try{$group=gd_sources($s,$ops,$today,false);foreach($group['purchaseOrders'] as $p)if($p['entity']==='TTI'&&$p['sourceId']==='PS-RICE-26003')$comparison[]=['sourceId'=>$p['sourceId'],'receivedKnown'=>$p['receivedKnown'],'receiptCount'=>count($p['receiptIds'])];}catch(DomainException $e){$comparison[]=['sourceError'=>$e->getMessage()];}
          echo 'NATIVE_PURCHASE_LINK_REVIEW '.json_encode(['readOnly'=>true,'sourceId'=>'PS-RICE-26003','nativeLinks'=>$links,'unfilteredGroupComparison'=>$comparison,'accountsSnapshotStable'=>$sourceBefore===hash_file('sha256',TT_DATA_DIR.'/accounts.json')],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          PHP
          REMOTE
